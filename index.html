<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETRIS IA - Retro Neon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla de inicio -->
    <div id="startScreen" class="start-screen">
        <div class="start-container">
            <h1 class="title">TETRIS IA</h1>
            <p class="subtitle">Retro · Neon · IA</p>
            
            <div class="config-section">
                <label for="boardSize">Tamaño del tablero:</label>
                <select id="boardSize">
                    <option value="10x20">10x20 (Clásico)</option>
                    <option value="15x20">15x20 (Ancho)</option>
                    <option value="8x16">8x16 (Mini)</option>
                </select>
            </div>
            
            <div class="config-section">
                <label for="gameLevel">Nivel inicial:</label>
                <select id="gameLevel">
                    <option value="1">Nivel 1 - Suave</option>
                    <option value="2">Nivel 2 - Medio</option>
                    <option value="3">Nivel 3 - Rápido</option>
                    <option value="4">Nivel 4 - Locura</option>
                </select>
            </div>
            
            <button id="startButton" class="start-button">Iniciar juego</button>
        </div>
    </div>

    <!-- Contenedor del juego -->
    <div id="gameContainer" class="game-container hidden">
        <div class="game-wrapper">
            <!-- Panel principal -->
            <div class="main-panel">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div class="hud">
                    <div class="hud-item">
                        <span class="hud-label">Puntuación</span>
                        <span id="score" class="hud-value">0</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">Líneas</span>
                        <span id="lines" class="hud-value">0</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">Nivel</span>
                        <span id="level" class="hud-value">1</span>
                    </div>
                </div>
            </div>

            <!-- Panel lateral con pieza siguiente -->
            <div class="side-panel">
                <h3 class="next-title">Siguiente</h3>
                <canvas id="nextPieceCanvas" width="120" height="120"></canvas>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal hidden">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>Puntuación final: <span id="finalScore">0</span></p>
            <p>Líneas completadas: <span id="finalLines">0</span></p>
            <button id="restartButton" class="modal-button">Reiniciar</button>
            <button id="menuButton" class="modal-button secondary">Volver al menú</button>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
